services:
  postgres-dev:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jules}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-sevra_atlas_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - sevra-dev-network

  redis-dev:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sevra-dev-network

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-jules}:${POSTGRES_PASSWORD:-password}@postgres-dev:5432/${POSTGRES_DB:-sevra_atlas_dev}?schema=public
      - REDIS_URL=redis://redis-dev:6379
      - REDIS_QUEUE_URL=redis://redis-dev:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev_secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_secret}
      - SESSION_SECRET=${SESSION_SECRET:-dev_session_secret}
    ports:
      - "3000:3000"
    depends_on:
      - postgres-dev
      - redis-dev
    command: sh -c "npx prisma generate && npm run dev"
    networks:
      - sevra-dev-network

networks:
  sevra-dev-network:
    name: sevra-dev-net
    driver: bridge

volumes:
  postgres_dev_data:
