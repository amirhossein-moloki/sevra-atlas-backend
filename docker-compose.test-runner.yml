services:
  test-runner:
    image: node:20-slim
    container_name: sevra-test-runner
    working_dir: /app
    env_file:
      - .env.test
    environment:
      - NODE_ENV=test
      - SANDBOX_MODE=true
      - POSTGRES_HOST=postgres-test
      - REDIS_HOST=redis-test
      - REDIS_QUEUE_HOST=redis-test
    volumes:
      - .:/app
      - test-results:/test-results
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - sevra-test-network
    entrypoint: ["/bin/bash", "scripts/test-runner.sh"]

  postgres-test:
    image: postgres:15-alpine
    env_file:
      - .env.test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
      POSTGRES_DB: ${POSTGRES_DB:-testdb}
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - sevra-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-testuser} -d $${POSTGRES_DB:-testdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    env_file:
      - .env.test
    networks:
      sevra-test-network:
        aliases:
          - redis_cache
          - redis_queue
          - redis-queue
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  sevra-test-network:
    name: sevra-test-net
    driver: bridge

volumes:
  test-results:
