openapi: 3.0.0
info:
  version: 1.0.0
  title: Sevra Atlas API
  description: Unified Directory + Blog API - Automatically generated and enforced.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiFailure:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        data:
          nullable: true
          type: object
        message:
          type: string
      required:
        - success
        - data
        - message
    Media:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        storageKey:
          type: string
        type:
          type: string
        mime:
          type: string
        sizeBytes:
          type: number
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        duration:
          type: number
          nullable: true
        altText:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        kind:
          type: string
          nullable: true
        variants:
          type: object
          nullable: true
          additionalProperties:
            type: object
            properties:
              url:
                type: string
              mime:
                type: string
              width:
                type: number
              height:
                type: number
              sizeBytes:
                type: number
            required:
              - url
              - mime
              - width
              - height
              - sizeBytes
        createdAt:
          type: string
      required:
        - id
        - url
        - storageKey
        - type
        - mime
        - sizeBytes
        - width
        - height
        - duration
        - altText
        - title
        - kind
        - variants
        - createdAt
    SeoMeta:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        ogTitle:
          type: string
          nullable: true
        ogDescription:
          type: string
          nullable: true
        twitterTitle:
          type: string
          nullable: true
        twitterDesc:
          type: string
          nullable: true
        h1:
          type: string
          nullable: true
        breadcrumbLabel:
          type: string
          nullable: true
      required:
        - id
        - title
        - description
        - canonicalUrl
        - ogTitle
        - ogDescription
        - twitterTitle
        - twitterDesc
        - h1
        - breadcrumbLabel
    Province:
      type: object
      properties:
        id:
          type: string
        nameFa:
          type: string
        nameEn:
          type: string
          nullable: true
        slug:
          type: string
      required:
        - id
        - nameFa
        - nameEn
        - slug
    City:
      type: object
      properties:
        id:
          type: string
        nameFa:
          type: string
        nameEn:
          type: string
          nullable: true
        slug:
          type: string
        province:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Province'
            - type: object
              nullable: true
              enum:
                - null
          type: object
      required:
        - id
        - nameFa
        - nameEn
        - slug
    Neighborhood:
      type: object
      properties:
        id:
          type: string
        nameFa:
          type: string
        slug:
          type: string
      required:
        - id
        - nameFa
        - slug
    Specialty:
      type: object
      properties:
        id:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        order:
          type: number
      required:
        - id
        - nameFa
        - slug
        - order
    Artist:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        slug:
          type: string
        summary:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avgRating:
          type: number
        reviewCount:
          type: number
        verification:
          type: string
        status:
          type: string
        avatar:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Media'
            - type: object
              nullable: true
              enum:
                - null
          type: object
        city:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/City'
            - type: object
              nullable: true
              enum:
                - null
          type: object
      required:
        - id
        - fullName
        - slug
        - summary
        - bio
        - avgRating
        - reviewCount
        - verification
        - status
    SalonArtistResponse:
      type: object
      properties:
        artist:
          $ref: '#/components/schemas/Artist'
        roleTitle:
          type: string
          nullable: true
        isActive:
          type: boolean
      required:
        - artist
        - roleTitle
        - isActive
    Salon:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        summary:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        instagram:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        addressLine:
          type: string
          nullable: true
        fullAddress:
          type: string
          nullable: true
        avgRating:
          type: number
        reviewCount:
          type: number
        verification:
          type: string
        status:
          type: string
        avatar:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Media'
            - type: object
              nullable: true
              enum:
                - null
          type: object
        city:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/City'
            - type: object
              nullable: true
              enum:
                - null
          type: object
        neighborhood:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Neighborhood'
            - type: object
              nullable: true
              enum:
                - null
          type: object
        salonArtists:
          type: array
          items:
            $ref: '#/components/schemas/SalonArtistResponse'
      required:
        - id
        - name
        - slug
        - summary
        - description
        - phone
        - instagram
        - website
        - addressLine
        - avgRating
        - reviewCount
        - verification
        - status
    BlogPost:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        publishedAt:
          type: string
          nullable: true
        status:
          type: string
        author:
          type: object
          properties:
            displayName:
              type: string
            avatar:
              nullable: true
              anyOf:
                - allOf:
                    - $ref: '#/components/schemas/Media'
                - type: object
                  nullable: true
                  enum:
                    - null
              type: object
          required:
            - displayName
        category:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
          required:
            - id
            - name
            - slug
        coverMedia:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Media'
            - type: object
              nullable: true
              enum:
                - null
          type: object
      required:
        - id
        - slug
        - title
        - excerpt
        - content
        - publishedAt
        - status
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        order:
          type: number
      required:
        - id
        - name
        - slug
        - description
        - order
    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
      required:
        - id
        - name
        - slug
        - description
    Comment:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
        status:
          type: string
        user:
          type: object
          properties:
            username:
              type: string
            firstName:
              type: string
            lastName:
              type: string
          required:
            - username
            - firstName
            - lastName
      required:
        - id
        - content
        - createdAt
        - status
        - user
    Review:
      type: object
      properties:
        id:
          type: string
        rating:
          type: number
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: string
        author:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            avatar:
              type: string
              nullable: true
          required:
            - firstName
            - lastName
      required:
        - id
        - rating
        - title
        - body
        - status
        - createdAt
    ArtistCertification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        issuer:
          type: string
        issuedAt:
          type: string
          nullable: true
        isVerified:
          type: boolean
        media:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Media'
            - type: object
              nullable: true
              enum:
                - null
          type: object
      required:
        - id
        - title
        - issuer
        - issuedAt
        - isVerified
    ArtistSpecialtyResponse:
      type: object
      properties:
        specialtyId:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        priceToman:
          type: string
          nullable: true
        durationMin:
          type: number
          nullable: true
        isActive:
          type: boolean
        note:
          type: string
          nullable: true
        order:
          type: number
      required:
        - specialtyId
        - nameFa
        - slug
        - priceToman
        - durationMin
        - isActive
        - note
        - order
    SalonServiceResponse:
      type: object
      properties:
        serviceId:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        priceToman:
          type: string
          nullable: true
        durationMin:
          type: number
          nullable: true
        isActive:
          type: boolean
        notes:
          type: string
          nullable: true
      required:
        - serviceId
        - nameFa
        - slug
        - priceToman
        - durationMin
        - isActive
        - notes
    GroupedSalonServiceResponse:
      type: object
      properties:
        category:
          type: object
          properties:
            id:
              type: string
            nameFa:
              type: string
            slug:
              type: string
          required:
            - id
            - nameFa
            - slug
        services:
          type: array
          items:
            $ref: '#/components/schemas/SalonServiceResponse'
      required:
        - category
        - services
    Series:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        orderStrategy:
          type: string
      required:
        - id
        - title
        - slug
        - description
        - orderStrategy
    Author:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        avatar:
          nullable: true
          anyOf:
            - allOf:
                - $ref: '#/components/schemas/Media'
            - type: object
              nullable: true
              enum:
                - null
          type: object
      required:
        - userId
        - displayName
        - bio
    Revision:
      type: object
      properties:
        id:
          type: string
        postId:
          type: string
        title:
          type: string
        content:
          type: string
        changeNote:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - postId
        - title
        - content
        - changeNote
        - createdAt
    Reaction:
      type: object
      properties:
        id:
          type: string
        reaction:
          type: string
        userId:
          type: string
        createdAt:
          type: string
      required:
        - id
        - reaction
        - userId
        - createdAt
    Page:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        content:
          type: string
        status:
          type: string
        publishedAt:
          type: string
          nullable: true
      required:
        - id
        - slug
        - title
        - content
        - status
        - publishedAt
    MenuItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
        order:
          type: number
        targetBlank:
          type: boolean
        parentId:
          type: string
          nullable: true
      required:
        - id
        - label
        - url
        - order
        - targetBlank
        - parentId
    Menu:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
      required:
        - id
        - name
        - location
    Follow:
      type: object
      properties:
        id:
          type: string
        followerId:
          type: string
        targetType:
          type: string
        salonId:
          type: string
          nullable: true
        artistId:
          type: string
          nullable: true
      required:
        - id
        - followerId
        - targetType
    Save:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        targetType:
          type: string
        salonId:
          type: string
          nullable: true
        artistId:
          type: string
          nullable: true
        postId:
          type: string
          nullable: true
      required:
        - id
        - userId
        - targetType
    VerificationRequest:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - status
        - notes
        - createdAt
    Report:
      type: object
      properties:
        id:
          type: string
        reason:
          type: string
        details:
          type: string
          nullable: true
        status:
          type: string
      required:
        - id
        - reason
        - details
        - status
    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        entityType:
          type: string
        tier:
          type: string
        price:
          type: string
        durationDays:
          type: number
        features:
          type: array
          items:
            type: string
      required:
        - id
        - name
        - entityType
        - tier
        - price
        - durationDays
        - features
    Subscription:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        status:
          type: string
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
        nextBillingDate:
          type: string
          nullable: true
      required:
        - id
        - planId
        - status
        - startDate
        - endDate
        - nextBillingDate
    Payment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
        status:
          type: string
        trackId:
          type: string
          nullable: true
        paymentUrl:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - amount
        - status
        - trackId
        - paymentUrl
        - createdAt
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            phoneNumber:
              type: string
            role:
              type: string
          required:
            - id
            - phoneNumber
            - role
      required:
        - accessToken
        - refreshToken
        - user
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        phoneNumber:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - USER
            - SALON
            - ARTIST
            - AUTHOR
            - MODERATOR
            - ADMIN
            - SUPER_ADMIN
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - DELETED
        gender:
          type: string
          nullable: true
          enum:
            - FEMALE
            - MALE
            - OTHER
            - UNSPECIFIED
        bio:
          type: string
          nullable: true
        cityId:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - username
        - phoneNumber
        - firstName
        - lastName
        - role
        - status
        - gender
        - bio
        - cityId
        - createdAt
        - updatedAt
    ServiceCategory:
      type: object
      properties:
        id:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        order:
          type: number
          nullable: true
      required:
        - id
        - nameFa
        - slug
        - order
    Service:
      type: object
      properties:
        id:
          type: string
        categoryId:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/ServiceCategory'
      required:
        - id
        - categoryId
        - nameFa
        - slug
        - description
    AdminAuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            username:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            role:
              type: string
          required:
            - id
            - username
            - email
            - role
      required:
        - accessToken
        - refreshToken
        - user
  parameters: {}
paths:
  /auth/otp/request:
    post:
      summary: Request OTP code
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                  pattern: ^(\+98|0)?9\d{9}$
                  description: Iranian phone number
                  example: '09123456789'
              required:
                - phoneNumber
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                      - message
                required:
                  - success
                  - data
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
  /auth/otp/verify:
    post:
      summary: Verify OTP and login
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                  pattern: ^(\+98|0)?9\d{9}$
                  example: '09123456789'
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: '123456'
              required:
                - phoneNumber
                - code
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/AuthResponse'
                required:
                  - success
                  - data
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
  /auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              required:
                - refreshToken
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/AuthResponse'
                required:
                  - success
                  - data
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
  /auth/logout:
    post:
      summary: Logout user
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              required:
                - refreshToken
      responses:
        '204':
          description: Logged out successfully
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
  /auth/logout-all:
    post:
      summary: Logout user from all devices
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out from all devices successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
                    required:
                      - ok
                required:
                  - success
                  - data
        '400':
          description: Bad Request / Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiFailure'
